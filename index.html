<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskVibe - O Futuro das Recompensas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6200EE;
            --primary-light: #9d4edd;
            --secondary: #00BFA5;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de Luzes no Fundo (Ambient Glow) */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            top: -50px;
            left: -50px;
            opacity: 0.2;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--secondary);
            filter: blur(150px);
            bottom: -50px;
            right: -50px;
            opacity: 0.15;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 440px;
            width: 90%;
            padding: 50px 40px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 30px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 4px; /* Borda gradiente */
            display: inline-block;
            box-shadow: 0 20px 40px rgba(98, 0, 238, 0.3);
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            object-fit: cover;
            background: var(--bg-dark);
        }

        .version {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
            font-weight: 800;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            background: linear-gradient(to right, #fff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        p {
            color: #a1a1aa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .btn-download {
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 20px 40px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .btn-download:hover {
            transform: scale(1.03);
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 15px 40px rgba(0, 191, 165, 0.4);
        }

        .btn-download svg {
            width: 24px;
            fill: currentColor;
        }

        .info {
            margin-top: 35px;
            font-size: 0.8rem;
            color: #52525b;
            line-height: 1.6;
        }

        .info b { color: #888; }

        /* Animação de Floating */
        .container {
            animation: fadeIn 1s ease-out, float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <!-- Substitua pelo seu arquivo real -->
            <img src="logo_taskvibe.png" alt="TV">
        </div>
        
        <span class="version">Official Beta v1.0.0</span>
        
        <h1>TaskVibe</h1>
        <p>A nova era de micro-tarefas chegou. Realize missões e saque via PIX instantaneamente.</p>

        </div>
    </div>

</body>
</html>
